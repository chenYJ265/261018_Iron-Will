<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>鋼鐵大賽棒次</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
<style>
:root {
  --bg:#eeecea; --surface:#ffffff; --surface2:#f5f3f0;
  --fg:#141210; --fg2:#706b64; --border:#dedad4;
  --accent:#e24218; --r:10px;
  --c0:#c83a12; --c0b:#fdeee8;
  --c1:#2061c4; --c1b:#e6eef9;
  --c2:#a96b00; --c2b:#fdf3de;
  --c3:#1a8c50; --c3b:#e2f5ea;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#111010; --surface:#1c1b1a; --surface2:#252321;
    --fg:#f0ece6; --fg2:#8a847c; --border:#2e2b28; --accent:#f05530;
    --c0:#f06040; --c0b:#2a1008; --c1:#5086e8; --c1b:#0a1626;
    --c2:#d4920a; --c2b:#221608; --c3:#38c46a; --c3b:#082214;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:#111010; --surface:#1c1b1a; --surface2:#252321;
  --fg:#f0ece6; --fg2:#8a847c; --border:#2e2b28; --accent:#f05530;
  --c0:#f06040; --c0b:#2a1008; --c1:#5086e8; --c1b:#0a1626;
  --c2:#d4920a; --c2b:#221608; --c3:#38c46a; --c3b:#082214;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: 'DM Sans', system-ui, sans-serif;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-block: 12px 20px;
}
.ph { margin-bottom: 8px; }
.ph-title { font: 700 clamp(20px,5vw,28px)/1 'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:.02em; }
.ph-title em { color:var(--accent); font-style:normal; }
.ph-sub { font-size:10px; color:var(--fg2); margin-top:2px; }

/* Roster */
.roster {
  display:flex; flex-wrap:wrap; align-items:center; gap:8px;
  padding:8px 10px; margin-bottom:8px;
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r); max-width:900px;
}
.roster-hd { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:var(--fg2); align-self:center; }
.rc {
  display:inline-flex; align-items:center; gap:5px;
  padding:4px 10px 4px 4px; border-radius:20px; font-size:13px; font-weight:600;
}
.rc-av {
  width:20px; height:20px; border-radius:50%; object-fit:cover; object-position:top;
  border:1.5px solid rgba(0,0,0,.08); flex-shrink:0;
}

/* Table */
.tbl-wrap {
  max-width:900px; background:var(--surface);
  border:1px solid var(--border); border-radius:var(--r); overflow:hidden;
}
table { width:100%; border-collapse:collapse; }
thead th {
  background:var(--surface2); padding:6px 10px;
  font-size:9px; font-weight:700; text-transform:uppercase;
  letter-spacing:.1em; color:var(--fg2); border-bottom:1px solid var(--border); text-align:left;
}
thead th:nth-child(2) { text-align:center; }
tbody tr { border-bottom:1px solid var(--border); }
tbody tr:last-child { border-bottom:none; }
td { padding:6px 10px; vertical-align:middle; }

.col-ev { width:1%; white-space:nowrap; }
.ev-num { font-size:9px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); display:block; margin-bottom:1px; }
.ev-name { font:700 15px/1 'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:.03em; }

.col-rules { width:130px; }
.rule-val {
  display:block; width:100%; background:transparent; border:none;
  border-bottom:1px solid transparent; padding:1px 0; font-size:11px; line-height:1.4;
  color:var(--fg); font-family:'DM Sans',sans-serif; cursor:text; transition:border-color .13s;
}
.rule-val:focus { outline:none; border-bottom-color:var(--accent); }
.rule-val::placeholder { color:var(--fg2); opacity:.45; }

.lineup-wrap { display:flex; flex-wrap:wrap; gap:4px; align-items:center; }

/* Chip with avatar */
.chip {
  display:inline-flex; align-items:center; gap:4px;
  padding:3px 7px 3px 3px; border-radius:20px;
  font-size:13px; font-weight:600;
  cursor:grab; user-select:none; border:none; line-height:1;
  transition:box-shadow .12s;
}
.chip:active { cursor:grabbing; }
.chip.sortable-ghost { opacity:.3; }
.chip.sortable-chosen { box-shadow:0 2px 8px rgba(0,0,0,.18); z-index:1; }
.chip-av {
  width:20px; height:20px; border-radius:50%; object-fit:cover; object-position:top;
  border:1.5px solid rgba(0,0,0,.08); flex-shrink:0;
}
.chip-ord {
  display:inline-flex; align-items:center; justify-content:center;
  width:11px; height:11px; border-radius:50%;
  font-size:7px; font-weight:700; background:rgba(0,0,0,.12); flex-shrink:0;
}
.chip-name { padding: 0 1px; }
.chip-x {
  width:12px; height:12px; border-radius:50%; border:none;
  background:rgba(0,0,0,.1); color:inherit; font-size:7px;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  padding:0; flex-shrink:0; transition:background .12s; font-family:inherit;
}
.chip-x:hover { background:rgba(0,0,0,.22); }

.chip-ghost {
  display:inline-flex; align-items:center; gap:4px;
  padding:3px 8px 3px 3px; border-radius:20px;
  font-size:13px; font-weight:500;
  cursor:pointer; border:1.5px dashed var(--border);
  color:var(--fg2); background:transparent; line-height:1;
  transition:border-color .12s, color .12s;
}
.chip-ghost:hover { border-color:var(--accent); color:var(--accent); }
.chip-ghost-av {
  width:20px; height:20px; border-radius:50%; object-fit:cover; object-position:top;
  opacity:.45; flex-shrink:0; filter:grayscale(1);
}
.chip-ghost:hover .chip-ghost-av { opacity:.7; filter:grayscale(0); }

.c0 { background:var(--c0b); color:var(--c0); }
.c1 { background:var(--c1b); color:var(--c1); }
.c2 { background:var(--c2b); color:var(--c2); }
.c3 { background:var(--c3b); color:var(--c3); }

.actions { margin-top:8px; display:flex; gap:7px; max-width:900px; flex-wrap:wrap; align-items:center; }
.btn {
  padding:7px 14px; border-radius:7px; font-size:12px; font-weight:600; cursor:pointer;
  border:1.5px solid var(--border); background:transparent; color:var(--fg2);
  font-family:'DM Sans',sans-serif; transition:opacity .13s;
}
.btn:hover { opacity:.75; }
#toast {
  position:fixed; bottom:max(16px,env(safe-area-inset-bottom,0px));
  left:50%; transform:translateX(-50%) translateY(60px);
  background:var(--fg); color:var(--bg);
  padding:8px 18px; border-radius:20px;
  font-size:12px; font-weight:600; white-space:nowrap;
  transition:transform .25s cubic-bezier(.16,1,.3,1); z-index:100;
}
#toast.show { transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="ph">
  <h1 class="ph-title">棒次<em>配置</em></h1>
  <p class="ph-sub">台中鋼鐵大賽 推廣組 · 拖曳調整棒次順序 · 點 × 移除 · 點灰色名字加入</p>
</div>
<div class="roster" id="roster"></div>
<div class="tbl-wrap">
  <table>
    <thead><tr><th>項目</th><th>重量 ／ 趟數</th><th>棒次</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>
<div class="actions">
  <button class="btn" onclick="copyLineup()">📋 複製棒次</button>
  <span id="sync-status" style="font-size:11px;color:var(--fg2);margin-left:4px;">☁ 連線中…</span>
</div>

<div id="toast"></div>

const MEMBERS = [
  { id:0, name:'周逼', cls:'c0' },
  { id:1, name:'怡潔', cls:'c1' },
  { id:2, name:'黃哥', cls:'c2' },
  { id:3, name:'怡靜', cls:'c3' },
];

const DEFAULTS = [
  { id:'sandbag', name:'沙袋',    members:[0,2,1],   reps:'16m × 6 趟',   weight:'75 lbs（混合）' },
  { id:'burpee',  name:'波比跳',  members:[1,0,2,3], reps:'30 下',         weight:'跨低平行槓' },
  { id:'yoke',    name:'龍門架',  members:[0,2,3],   reps:'16m × 3 趟',   weight:'80 kg（混合）' },
  { id:'fan',     name:'風扇車',  members:[2,3],     reps:'累積 30 Cal',   weight:'達標舉手換站' },
  { id:'farmer',  name:'農夫走路',members:[0,1,2,3], reps:'16m × 9 趟',   weight:'2 × 16 kg（混合）' },
  { id:'squat',   name:'深蹲',    members:[0,1],     reps:'30 下',         weight:'徒手至藥球' },
  { id:'run',     name:'1400M',   members:[0,1,2,3], reps:'全隊同跑',      weight:'—' },
];

let state = clone(DEFAULTS);
function clone(x) { return JSON.parse(JSON.stringify(x)); }
const API_URL = 'https://script.google.com/macros/s/AKfycbxP-7rVXmsG7m1yRMeteC9ifAuVJv7TiGj0Bqw2JWr3gaua3xTSmJpZUI3mDX38XwWw/exec';

function load() { try { const s=localStorage.getItem('steel-lineup-v5'); if(s) state=JSON.parse(s); } catch(_){} }
function save() {
  try { localStorage.setItem('steel-lineup-v5', JSON.stringify(state)); } catch(_){}
  pushToCloud();
}

let pushTid;
function pushToCloud() {
  setSyncStatus('syncing');
  clearTimeout(pushTid);
  pushTid = setTimeout(async () => {
    try {
      const url = API_URL + '?data=' + encodeURIComponent(JSON.stringify(state));
      await fetch(url, { mode:'no-cors' });
      setSyncStatus('ok');
    } catch(_) { setSyncStatus('err'); }
  }, 1000);
}

function setSyncStatus(s) {
  const el = document.getElementById('sync-status');
  if (!el) return;
  if (s === 'syncing') { el.textContent = '☁ 同步中…'; el.style.color = 'var(--fg2)'; }
  else if (s === 'ok')  { el.textContent = '✓ 已同步';  el.style.color = 'var(--fg2)'; }
  else                  { el.textContent = '⚠ 同步失敗'; el.style.color = 'var(--accent)'; }
}

function renderRoster() {
  const el = document.getElementById('roster');
  el.innerHTML = '<span class="roster-hd">隊員</span>';
  MEMBERS.forEach(m => {
    const c = document.createElement('span');
    c.className = 'rc ' + m.cls;
    const av = document.createElement('img');
    av.className = 'rc-av'; av.src = AVATARS[m.id]; av.alt = m.name;
    c.appendChild(av);
    c.appendChild(document.createTextNode(m.name));
    el.appendChild(c);
  });
}

function renderTable() {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  state.forEach((ev, ei) => {
    const tr = document.createElement('tr');

    const tdEv = document.createElement('td');
    tdEv.className = 'col-ev';
    tdEv.innerHTML = `<span class="ev-num">${ei+1}</span><span class="ev-name">${ev.name}</span>`;
    tr.appendChild(tdEv);

    const tdRules = document.createElement('td');
    tdRules.className = 'col-rules';
    const rIn = document.createElement('input');
    rIn.className='rule-val'; rIn.type='text'; rIn.placeholder='趟數'; rIn.value=ev.reps||'';
    rIn.addEventListener('input', e => { state[ei].reps=e.target.value; save(); });
    const wIn = document.createElement('input');
    wIn.className='rule-val'; wIn.type='text'; wIn.placeholder='重量'; wIn.value=ev.weight||'';
    wIn.addEventListener('input', e => { state[ei].weight=e.target.value; save(); });
    tdRules.appendChild(rIn); tdRules.appendChild(wIn);
    tr.appendChild(tdRules);

    const tdLineup = document.createElement('td');
    const wrap = document.createElement('div');
    wrap.className = 'lineup-wrap';

    const chipsDiv = document.createElement('div');
    chipsDiv.id = 'chips-'+ev.id;
    chipsDiv.style.cssText = 'display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center;';
    ev.members.forEach(mid => chipsDiv.appendChild(makeChip(MEMBERS[mid], ei)));
    wrap.appendChild(chipsDiv);

    MEMBERS.filter(m => !ev.members.includes(m.id)).forEach(m => {
      const ghost = document.createElement('div');
      ghost.className = 'chip-ghost';
      const gav = document.createElement('img');
      gav.className = 'chip-ghost-av'; gav.src = AVATARS[m.id]; gav.alt = m.name;
      ghost.appendChild(gav);
      ghost.appendChild(document.createTextNode('＋'+m.name));
      ghost.onclick = () => { state[ei].members.push(m.id); save(); renderTable(); };
      wrap.appendChild(ghost);
    });

    tdLineup.appendChild(wrap);
    tr.appendChild(tdLineup);
    tbody.appendChild(tr);

    Sortable.create(chipsDiv, {
      animation:130, ghostClass:'sortable-ghost', chosenClass:'sortable-chosen',
      onEnd() {
        const order = [...chipsDiv.querySelectorAll('.chip')].map(el => +el.dataset.mid);
        state[ei].members = order; save();
        chipsDiv.querySelectorAll('.chip-ord').forEach((el,i) => { el.textContent=i+1; });
      }
    });
  });
}

function makeChip(m, ei) {
  const ord = state[ei].members.indexOf(m.id)+1;
  const chip = document.createElement('div');
  chip.className='chip '+m.cls; chip.dataset.mid=m.id; chip.title='拖曳調整棒次';

  const av = document.createElement('img');
  av.className='chip-av'; av.src=AVATARS[m.id]; av.alt=m.name;

  const ordEl = document.createElement('span');
  ordEl.className='chip-ord'; ordEl.textContent=ord;

  const nameEl = document.createElement('span');
  nameEl.className='chip-name'; nameEl.textContent=m.name;

  const xEl = document.createElement('button');
  xEl.className='chip-x'; xEl.textContent='×'; xEl.title=`移除 ${m.name}`;
  xEl.onclick = e => {
    e.stopPropagation();
    state[ei].members=state[ei].members.filter(id=>id!==m.id);
    save(); renderTable();
  };

  chip.appendChild(av);
  chip.appendChild(ordEl);
  chip.appendChild(nameEl);
  chip.appendChild(xEl);
  return chip;
}

function copyLineup() {
  const lines=['🏋️ 鋼鐵大賽棒次（推廣組）\n'];
  state.forEach((ev,i) => {
    const names=ev.members.map(id=>MEMBERS[id].name).join('、')||'（未配置）';
    const notes=[ev.reps,ev.weight].filter(s=>s&&s!=='—').join(' ／ ');
    lines.push(`第${i+1}關 ${ev.name}：${names}`+(notes?`\n   ${notes}`:''));
  });
  navigator.clipboard.writeText(lines.join('\n'))
    .then(()=>toast('✓ 已複製棒次'))
    .catch(()=>toast('複製失敗，請手動選取'));
}

let toastTid;
function toast(msg) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTid);
  toastTid=setTimeout(()=>el.classList.remove('show'),2500);
}


async function initLoad() {
  load(); renderRoster(); renderTable();
  setSyncStatus('syncing');
  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    if (Array.isArray(data) && data.length) {
      state = data;
      try { localStorage.setItem('steel-lineup-v5', JSON.stringify(state)); } catch(_){}
      renderTable();
    }
    setSyncStatus('ok');
  } catch(_) { setSyncStatus('err'); }
}

initLoad();
</script>
